zend_extension=xdebug

[xdebug]
xdebug.mode=develop,debug
; host.docker.internal resolves to the Windows host IP from inside the container
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.start_with_request=yes
; Must match the server name configured in PhpStorm under
; Settings > PHP > Servers (name: biblioteca)
xdebug.idekey=PHPSTORM
