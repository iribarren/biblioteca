server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Route all requests through Symfony's front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Pass PHP files to PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Prevent PHP-FPM from being exposed directly
        internal;
    }

    # Block access to any other .php files (security measure)
    location ~ \.php$ {
        return 404;
    }

    # Block access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/backend_access.log;
    error_log  /var/log/nginx/backend_error.log;
}
