# Production nginx configuration for the Symfony backend.
# Inherits the security posture of backend.conf and adds:
#   - Gzip compression
#   - FastCGI micro-cache (1-second TTL for GET requests)
#   - Rate limiting on /api/ endpoints
#   - HSTS and Permissions-Policy headers
#   - Stricter body size limit

# ── Rate limiting ──────────────────────────────────────────────────────────────
# 10 requests/second per IP, burst of 20 queued without error.
# Defined in the http block via an include; if your compose setup does not use
# a custom nginx.conf, move these limit_req_zone directives into
# /etc/nginx/nginx.conf instead and remove them from here — they must live
# outside the server {} block.
#
# Because Docker's nginx:alpine ships a minimal nginx.conf that sources
# /etc/nginx/conf.d/*.conf inside its http {} block, these map/limit_req_zone
# directives are valid here.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ── FastCGI micro-cache ────────────────────────────────────────────────────────
# Caches PHP responses for 1 second. Absorbs traffic spikes without adding
# stale data risk. Only GET/HEAD requests are cached; POST and authenticated
# requests bypass the cache (see fastcgi_cache_bypass below).
fastcgi_cache_path /tmp/nginx_cache
    levels=1:2
    keys_zone=symfony_cache:10m
    max_size=100m
    inactive=60s
    use_temp_path=off;

fastcgi_cache_key "$scheme$request_method$host$request_uri";

server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;

    # ── Request size ───────────────────────────────────────────────────────────
    # The API accepts small JSON payloads only; 1 MB is generous.
    client_max_body_size 1m;

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options      "nosniff"                         always;
    add_header X-Frame-Options             "DENY"                            always;
    add_header X-XSS-Protection            "1; mode=block"                   always;
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;

    # HSTS: tell browsers to only connect over HTTPS for the next year.
    # includeSubDomains and preload are intentionally omitted until you confirm
    # all subdomains are HTTPS-ready.
    add_header Strict-Transport-Security   "max-age=31536000"                always;

    # Permissions-Policy: disable browser features the API backend never needs.
    add_header Permissions-Policy
        "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        always;

    # Hide nginx version from error pages and Server header.
    server_tokens off;

    # ── Routing ────────────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ── API rate limiting ──────────────────────────────────────────────────────
    # Applied before the request reaches PHP-FPM.
    # nodelay: return 429 immediately when the burst queue is full rather than
    # making the client wait.
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # ── PHP-FPM with micro-cache ───────────────────────────────────────────────
    location ~ ^/index\.php(/|$) {
        fastcgi_pass   backend-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        include        fastcgi_params;

        # Only cache anonymous GET/HEAD requests.
        # A non-empty Authorization header or a cookie signals an authenticated
        # session — those responses must never be served from cache.
        fastcgi_cache_bypass  $http_authorization $cookie_session;
        fastcgi_no_cache      $http_authorization $cookie_session;

        # Skip the cache for non-GET methods (POST, PUT, DELETE, PATCH).
        set $no_cache 0;
        if ($request_method !~ ^(GET|HEAD)$) {
            set $no_cache 1;
        }
        fastcgi_cache_bypass $no_cache;
        fastcgi_no_cache     $no_cache;

        fastcgi_cache        symfony_cache;
        fastcgi_cache_valid  200 1s;
        fastcgi_cache_valid  404 10s;

        # Expose cache status in response header for debugging (remove if undesired).
        add_header X-Cache-Status $upstream_cache_status always;

        # Prevent PHP-FPM from being accessed directly.
        internal;
    }

    # Block access to any other .php files.
    location ~ \.php$ {
        return 404;
    }

    # Block access to hidden files (.env, .git, etc.).
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }

    # ── Static asset caching ───────────────────────────────────────────────────
    # Long expiry is safe because Symfony appends content hashes to asset URLs.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/backend_access.log;
    error_log  /var/log/nginx/backend_error.log warn;
}
