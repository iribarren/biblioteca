services:

  # ── Backend nginx proxy ──────────────────────────────────────────────────────
  backend-nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./oracles-api:/var/www/backend:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-php
    restart: unless-stopped

  # ── Backend PHP-FPM (Symfony) ────────────────────────────────────────────────
  backend-php:
    build:
      context: ./oracles-api
      dockerfile: Dockerfile
    volumes:
      - ./oracles-api:/var/www/backend
      # Mount xdebug config so it only applies in dev, without rebuilding the image
      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: "${APP_SECRET:-change_me_before_production}"
      DATABASE_URL: "mysql://biblioteca_user:${MYSQL_PASSWORD:-biblioteca_pass}@mysql:3306/biblioteca?serverVersion=8.0&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: "http://localhost:3000"
      # Required for PhpStorm XDebug to map paths correctly
      PHP_IDE_CONFIG: "serverName=biblioteca"
    extra_hosts:
      # Allows xdebug inside the container to reach the PhpStorm debugger on Windows
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Frontend (Vite dev server) ───────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./thelibrary:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:5173"
    restart: unless-stopped

  # ── MySQL 8 ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    ports:
      - "33306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_secret}"
      MYSQL_DATABASE: biblioteca
      MYSQL_USER: biblioteca_user
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-biblioteca_pass}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
